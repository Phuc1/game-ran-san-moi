name: Android CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee -a build.log

      - name: Build debug APK
        shell: bash
        run: ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee -a build.log

      - name: Surface Gradle errors as annotations
        if: failure()
        run: python3 .github/scripts/surface_errors.py build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
