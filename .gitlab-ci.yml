# Android CI: unit tests + lint on every pipeline, debug APK for branches/MRs,
# signed release AAB (Google Play) on the default branch and tags.
#
# Required CI/CD variables for the release job (Settings > CI/CD > Variables, set Protected):
#   KEYSTORE_FILE   (type: File)       upload keystore .jks
#   STORE_PASSWORD  (Masked, Protected)
#   KEY_PASSWORD    (Masked, Protected)
# NOTE: pin the image tag you actually use. AGP 9.1 needs JDK 17+ and Android SDK 36 (build-tools 36.0.0).

stages:
  - test
  - build

default:
  image: ghcr.io/cirruslabs/android-sdk:36
  interruptible: true
  timeout: 30m

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  ANDROID_SDK_LICENSES: "accept"

.gradle_cache: &gradle_cache
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
        - gradle/libs.versions.toml
    paths:
      - .gradle-home/caches
      - .gradle-home/wrapper
    policy: pull-push

before_script:
  - java -version
  - chmod +x gradlew

unit_test:
  stage: test
  <<: *gradle_cache
  script:
    - ./gradlew testDebugUnitTest lintDebug
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - app/build/reports/tests/
      - app/build/reports/lint-results-debug.html
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml

apk_debug:
  stage: build
  <<: *gradle_cache
  needs: [unit_test]
  script:
    - ./gradlew assembleDebug
  artifacts:
    expire_in: 1 week
    paths:
      - app/build/outputs/apk/debug/*.apk
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

aab_release:
  stage: build
  <<: *gradle_cache
  needs: [unit_test]
  interruptible: false
  script:
    - test -n "$KEYSTORE_FILE" -a -n "$STORE_PASSWORD" -a -n "$KEY_PASSWORD" || { echo "Missing signing variables (must be Protected and this ref must be protected)"; exit 1; }
    - export KEYSTORE_PATH="$KEYSTORE_FILE"
    - ./gradlew bundleRelease
  artifacts:
    expire_in: 30 days
    paths:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt   # needed to de-obfuscate crash traces (R8 is on)
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
